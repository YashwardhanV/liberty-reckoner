name: libertyreckoner

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libertyreckoner}
      POSTGRES_USER: ${POSTGRES_USER:-libertyreckoner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libertyreckoner-local-password}
    volumes:
      - libertyreckoner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libertyreckoner} -d ${POSTGRES_DB:-libertyreckoner}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-libertyreckoner}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-libertyreckoner}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-libertyreckoner-local-password}
      LIBERTY_RECKONER_JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-123456}
      LIBERTY_RECKONER_JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      LIBERTY_RECKONER_SECURE_COOKIE: ${LIBERTY_RECKONER_SECURE_COOKIE:-false}
      LIBERTY_RECKONER_SEED_DEMO_DATA: ${LIBERTY_RECKONER_SEED_DEMO_DATA:-true}
      LIBERTY_RECKONER_CORS_ALLOWED_ORIGINS: ${LIBERTY_RECKONER_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      LIBERTY_RECKONER_NOTIFICATIONS_ENABLED: ${LIBERTY_RECKONER_NOTIFICATIONS_ENABLED:-true}
      LIBERTY_RECKONER_NOTIFICATION_TRANSPORT: ${LIBERTY_RECKONER_NOTIFICATION_TRANSPORT:-log}
      LIBERTY_RECKONER_MAIL_HEALTH_ENABLED: ${LIBERTY_RECKONER_MAIL_HEALTH_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  libertyreckoner_postgres:
